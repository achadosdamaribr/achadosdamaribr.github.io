<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achado Lar · achados pra casa</title>
<meta name="description" content="Curadoria de achados pra casa com preço bom. Decor, organização e cozinha.">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,300&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
  :root{--cereja:#A3192E;--rosa:#F7D3D8;--rosa2:#F1B9C1;--branco:#FFFAF9}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Tenor Sans",sans-serif;color:var(--cereja);
    background:
      repeating-linear-gradient(0deg,rgba(247,211,216,.55) 0 18px,transparent 18px 36px),
      repeating-linear-gradient(90deg,rgba(247,211,216,.55) 0 18px,transparent 18px 36px),#fff;
    display:flex;justify-content:center;padding:32px 16px}
  main{width:100%;max-width:440px;background:var(--branco);border:2px solid var(--cereja);border-radius:24px;
    padding:32px 24px 28px;text-align:center;box-shadow:0 10px 30px rgba(163,25,46,.12)}
  img.logo{width:132px;height:132px;border-radius:50%;border:3px solid var(--rosa2)}
  h1{font-family:"Fraunces",serif;font-weight:300;font-style:italic;font-size:2.4rem;margin:14px 0 0}
  h1 span{font-style:normal;letter-spacing:.35em;font-size:1.3rem;display:block;margin-top:2px}
  p.sub{letter-spacing:.18em;font-size:.72rem;margin:14px 0 24px;text-transform:uppercase}
  a.btn{display:block;text-decoration:none;color:var(--cereja);background:#fff;border:1.5px solid var(--cereja);
    border-radius:999px;padding:14px 18px;margin:12px 0;font-size:.95rem;transition:.2s}
  a.btn:hover{background:var(--cereja);color:#fff}
  a.btn.destaque{background:var(--cereja);color:#fff}
  small{display:block;margin-top:24px;font-size:.7rem;line-height:1.5;color:#7a4a52}
  small a{color:var(--cereja)}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Logo Achado Lar">
  <h1>achado<span>LAR</span></h1>
  <p class="sub">achados pra casa 🍒</p>
  <a class="btn destaque" href="https://www.instagram.com/meu.achadolar">Instagram @meu.achadolar</a>
  <a class="btn" href="https://br.pinterest.com/meuachadoslar/">Pinterest: inspirações e achados</a>
  <small>Eu garimpo, comparo e te mostro onde comprar com preço bom.<br>
  Alguns links são de afiliado: você paga o mesmo preço e eu ganho uma pequena comissão.<br>
  <a href="privacidade.html">Política de Privacidade</a> · achadosdamari.br@gmail.com</small>
</main>
</body>
</html>
